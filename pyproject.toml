[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socmon"
version = "0.1.0"
description = "Self-hosted social media monitoring and brand protection (alerting only, no remediation)"
requires-python = ">=3.11"
authors = [{ name = "Spearbit" }]
license = { text = "Proprietary" }
dependencies = [
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "apscheduler==3.10.4",
    "imagehash==4.3.1",
    "Pillow==10.4.0",
    "rapidfuzz==3.10.1",
    "PyYAML==6.0.2",
    "click==8.1.7",
    "rich==13.9.2",
    "feedparser==6.0.11",
    "SQLAlchemy==2.0.35",
    "alembic==1.13.3",
    "tenacity==9.0.0",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.3"]
slack = ["slack-sdk==3.33.1"]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.0",
    "mypy==1.11.2",
    "freezegun==1.5.1",
    "respx==0.21.1",
]

[project.scripts]
socmon = "socmon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["socmon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
